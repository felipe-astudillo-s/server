name: Build mcbackup

# Compila el .jar y lo publica en Releases.
# El hoster despues solo descarga y corre `java -jar mcbackup.jar`:
# no necesita JDK, ni Python, ni instalar nada.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:   # para poder correrlo a mano desde la web

permissions:
  contents: write      # necesario para crear el Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compilar
        # --release 17 = el .jar corre en cualquier JRE 17 o superior.
        # Minecraft 1.20+ ya pide Java 17, asi que todo hoster lo cumple.
        run: |
          mkdir -p build
          javac --release 17 -encoding UTF-8 -Xlint:all -d build *.java

      - name: Empaquetar el jar
        run: jar --create --file mcbackup.jar --main-class Main -C build .

      - name: Verificar que arranca
        run: |
          java -jar mcbackup.jar --help
          java -jar mcbackup.jar auth --help

      - name: Armar el zip que descarga el hoster
        # Con los scripts adentro: el hoster descomprime y hace doble click,
        # sin tener que escribir ningun comando.
        run: |
          mkdir -p paquete
          cp mcbackup.jar instalar.bat jugar.bat instalar-linux.sh jugar-linux.sh README.md JUGAR.md paquete/
          cd paquete && zip -r ../mcbackup.zip .

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mcbackup.zip
            mcbackup.jar

      - name: Guardar como artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: mcbackup
          path: mcbackup.zip
